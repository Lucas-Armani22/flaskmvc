<div class="table-responsive small">
  <table class="table table-striped table-sm">
    <thead>
      <tr>
        <th scope="col">Mês</th>
        <th scope="col">Total de Vendas</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        {% for vendas in vendas %}
        <td>{{vendas["mes"]}}</td>
        <td>{{locale.currency(vendas["total"], grouping=True, symbol=True)}}</td>
      </tr>
      {%endfor %}
    </tbody>
  </table>
</div>
